name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Verify Minecraft version exists
        run: |
          set -euo pipefail
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "Target Minecraft version: $MC_VERSION"
          if ! curl -sf "https://meta.fabricmc.net/v2/versions/game" | grep -qF "\"version\":\"$MC_VERSION\""; then
            AVAILABLE=$(curl -s "https://meta.fabricmc.net/v2/versions/game" | grep -oE '"version":"[^"]+"' | head -n 20 | tr '\n' ' ')
            echo "::error::Minecraft version $MC_VERSION not found. Latest 20 available: $AVAILABLE"
            exit 1
          fi

      - name: Resolve matching fabric-api version
        id: fabric-api
        run: |
          set -euo pipefail
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          VERSION=$(curl -sf "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' \
            | sed -E 's/<\/?version>//g' \
            | grep -F "+$MC_VERSION" \
            | tail -n1 || true)
          if [ -z "$VERSION" ]; then
            RECENT=$(curl -s "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -oE '<version>[^<]+</version>' | tail -n 20 | tr '\n' ' ')
            echo "::error::No published fabric-api build found for Minecraft $MC_VERSION. Most recent builds: $RECENT"
            exit 1
          fi
          echo "Resolved fabric-api version: $VERSION"
          sed -i "s/^fabric_api_version=.*/fabric_api_version=$VERSION/" gradle.properties

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-chunkban-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
